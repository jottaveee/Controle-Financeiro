<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <style>
        :root {
            --light-bg: #f5f5f5;
            --light-menu-bg: #e0e0e0;
            --light-text: #333333;
            --light-button-bg: #ffffff;
            --light-button-fg: #333333;
            --light-button-active: #e0e0e0;
            --light-highlight: #4CAF50;
            --light-card-bg: #ffffff;
            --light-shadow: #cccccc;
            
            --dark-bg: #2d2d2d;
            --dark-menu-bg: #1e1e1e;
            --dark-text: #ffffff;
            --dark-button-bg: #333333;
            --dark-button-fg: #ffffff;
            --dark-button-active: #555555;
            --dark-highlight: #4CAF50;
            --dark-card-bg: #333333;
            --dark-shadow: #111111;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Tela de login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
        }
        
        .login-card {
            background-color: var(--card-bg-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: var(--text-color);
        }
        
        .login-form .form-group {
            margin-bottom: 20px;
        }
        
        .login-form .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .login-form .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            background-color: var(--card-bg-color);
            color: var(--text-color);
        }
        
        .login-button {
            width: 100%;
            padding: 12px;
            background-color: var(--highlight-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .login-button:hover {
            background-color: #45a049;
        }
        
        .login-links {
            margin-top: 20px;
            text-align: center;
        }
        
        .login-link {
            color: var(--highlight-color);
            text-decoration: none;
            cursor: pointer;
        }
        
        .login-link:hover {
            text-decoration: underline;
        }
        
        /* Menu lateral */
        .side-menu {
            width: 200px;
            background-color: var(--menu-bg-color);
            padding: 20px 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .menu-button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            text-align: left;
            background-color: var(--menu-bg-color);
            border: none;
            color: var(--text-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .menu-button:hover {
            background-color: var(--button-active-color);
        }
        
        .accent-button {
            background-color: var(--highlight-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .accent-button:hover {
            background-color: #45a049;
        }
        
        /* Conteúdo principal */
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: var(--bg-color);
        }
        
        .page-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        
        /* Cards */
        .card {
            background-color: var(--card-bg-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px var(--shadow-color);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        
        /* Formulários */
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--card-bg-color);
            color: var(--text-color);
        }
        
        /* Tabela */
        .table-container {
            overflow-x: auto;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .data-table th {
            background-color: var(--menu-bg-color);
            font-weight: bold;
        }
        
        .data-table tr:hover {
            background-color: rgba(0,0,0,0.05);
        }
        
        /* Cards de resumo */
        .summary-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            flex: 1;
            padding: 20px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }
        
        .income-card {
            background-color: #4CAF50;
        }
        
        .expense-card {
            background-color: #F44336;
        }
        
        .balance-card {
            background-color: #2196F3;
        }
        
        .summary-card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .summary-card-value {
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Gráfico */
        .chart-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Menu superior */
        .top-menu {
            background-color: var(--menu-bg-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-name {
            font-weight: 500;
        }
        
        .logout-button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 500;
        }
        
        .logout-button:hover {
            text-decoration: underline;
        }
        
        .menu-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
        }
        
        /* Botões principais */
        .main-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .main-button {
            padding: 30px 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        .main-button:hover {
            transform: translateY(-3px);
        }
        
        .income-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .expense-btn {
            background-color: #F44336;
            color: white;
        }
        
        .report-btn {
            background-color: #2196F3;
            color: white;
        }
        
        .summary-btn {
            background-color: #9C27B0;
            color: white;
        }
        
        /* Tema escuro */
        body.dark-theme {
            --bg-color: var(--dark-bg);
            --menu-bg-color: var(--dark-menu-bg);
            --text-color: var(--dark-text);
            --button-bg-color: var(--dark-button-bg);
            --button-fg-color: var(--dark-button-fg);
            --button-active-color: var(--dark-button-active);
            --highlight-color: var(--dark-highlight);
            --card-bg-color: var(--dark-card-bg);
            --shadow-color: var(--dark-shadow);
        }
        
        /* Tema claro */
        body.light-theme {
            --bg-color: var(--light-bg);
            --menu-bg-color: var(--light-menu-bg);
            --text-color: var(--light-text);
            --button-bg-color: var(--light-button-bg);
            --button-fg-color: var(--light-button-fg);
            --button-active-color: var(--light-button-active);
            --highlight-color: var(--light-highlight);
            --card-bg-color: var(--light-card-bg);
            --shadow-color: var(--light-shadow);
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .side-menu {
                width: 100%;
                height: auto;
                padding: 10px 0;
            }
            
            .summary-cards {
                flex-direction: column;
            }
            
            .main-buttons {
                grid-template-columns: 1fr;
            }
            
            .login-card {
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body class="light-theme">
    <!-- Tela de login (inicialmente visível) -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <h1 class="login-title">Controle Financeiro</h1>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                
                <button type="submit" class="login-button">Entrar</button>
                
                <div class="login-links">
                    <a class="login-link" id="registerLink">Criar nova conta</a>
                </div>
            </form>
            
            <form class="login-form" id="registerForm" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="registerName" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirmar Senha:</label>
                    <input type="password" class="form-control" id="registerConfirmPassword" required>
                </div>
                
                <button type="submit" class="login-button">Registrar</button>
                
                <div class="login-links">
                    <a class="login-link" id="backToLoginLink">Voltar para login</a>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Aplicação principal (inicialmente oculta) -->
    <div id="appContainer" style="display: none;">
        <div class="top-menu">
            <div class="app-title">Controle Financeiro</div>
            <div class="user-menu">
                <span class="user-name" id="userNameDisplay"></span>
                <button class="logout-button" id="logoutButton">Sair</button>
            </div>
        </div>
        
        <div class="container">
            <div class="side-menu" id="sideMenu">
                <button class="menu-button" id="backButton">⬅️ Voltar</button>
                <div id="dynamicButtons">
                    <button class="menu-button" id="addIncomeButton">💰 Adicionar Receita</button>
                    <button class="menu-button" id="addExpenseButton">💸 Adicionar Despesa</button>
                </div>
                <button class="menu-button" id="reportButton">📊 Relatório</button>
                <button class="menu-button" id="summaryButton">📈 Resumo</button>
            </div>
            
            <div class="main-content" id="mainContent">
                <!-- Conteúdo será carregado aqui -->
            </div>
        </div>
    </div>
    
    <script>
        // Dados da aplicação
        const users = {};
        let currentUser = null;
        
        // Configurações
        const settings = {
            theme: 'light',
            language: 'pt'
        };
        
        // Ícones
        const icons = {
            home: "🏠",
            add: "➕",
            report: "📊",
            summary: "📈",
            config: "⚙️",
            back: "⬅️",
            income: "💰",
            expense: "💸",
            save: "💾",
            delete: "🗑️",
            calendar: "📅",
            food: "🍔",
            house: "🏠",
            transport: "🚗",
            fun: "🎮",
            health: "🏥",
            bills: "💡",
            education: "📚",
            other: "📦"
        };
        
        // Categorias de despesas
        const expenseCategories = [
            { icon: icons.food, name: "Alimentação" },
            { icon: icons.house, name: "Moradia" },
            { icon: icons.transport, name: "Transporte" },
            { icon: icons.fun, name: "Lazer" },
            { icon: icons.health, name: "Saúde" },
            { icon: icons.bills, name: "Contas (Luz/Água)" },
            { icon: icons.education, name: "Educação" },
            { icon: icons.other, name: "Outros" }
        ];
        
        // Meses para filtro
        const months = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];
        
        // Elementos da UI
        const loginContainer = document.getElementById('loginContainer');
        const appContainer = document.getElementById('appContainer');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const registerLink = document.getElementById('registerLink');
        const backToLoginLink = document.getElementById('backToLoginLink');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const logoutButton = document.getElementById('logoutButton');
        
        const sideMenu = document.getElementById('sideMenu');
        const backButton = document.getElementById('backButton');
        const dynamicButtons = document.getElementById('dynamicButtons');
        const addIncomeButton = document.getElementById('addIncomeButton');
        const addExpenseButton = document.getElementById('addExpenseButton');
        const reportButton = document.getElementById('reportButton');
        const summaryButton = document.getElementById('summaryButton');
        const mainContent = document.getElementById('mainContent');
        
        // Estado da aplicação
        let currentScreen = 'home';
        let menuVisible = false;
        
        // Carregar dados do localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('financeUsers');
            if (savedUsers) {
                Object.assign(users, JSON.parse(savedUsers));
            }
        }
        
        // Salvar dados no localStorage
        function saveData() {
            localStorage.setItem('financeUsers', JSON.stringify(users));
        }
        
        // Criptografar senha (simples - em produção use algo mais seguro)
        function encryptPassword(password) {
            return CryptoJS.SHA256(password).toString();
        }
        
        // Registrar novo usuário
        function registerUser(name, email, password) {
            if (users[email]) {
                alert('Este e-mail já está cadastrado!');
                return false;
            }
            
            if (password !== document.getElementById('registerConfirmPassword').value) {
                alert('As senhas não coincidem!');
                return false;
            }
            
            users[email] = {
                name,
                password: encryptPassword(password),
                transactions: {
                    incomes: [],
                    expenses: []
                },
                settings: {
                    theme: 'light',
                    language: 'pt'
                }
            };
            
            saveData();
            return true;
        }
        
        // Autenticar usuário
        function authenticateUser(email, password) {
            if (!users[email]) {
                alert('Usuário não encontrado!');
                return false;
            }
            
            if (users[email].password !== encryptPassword(password)) {
                alert('Senha incorreta!');
                return false;
            }
            
            return true;
        }
        
        // Alternar entre login e registro
        function toggleLoginRegister() {
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
        }
        
        // Iniciar sessão do usuário
        function startUserSession(email) {
            currentUser = email;
            userNameDisplay.textContent = users[email].name;
            
            // Aplicar configurações do usuário
            if (users[email].settings.theme === 'dark') {
                document.body.classList.add('dark-theme');
                document.body.classList.remove('light-theme');
            } else {
                document.body.classList.add('light-theme');
                document.body.classList.remove('dark-theme');
            }
            
            // Mostrar aplicação
            loginContainer.style.display = 'none';
            appContainer.style.display = 'block';
            
            // Carregar tela inicial
            showHomeScreen();
        }
        
        // Encerrar sessão do usuário
        function endUserSession() {
            currentUser = null;
            loginContainer.style.display = 'flex';
            appContainer.style.display = 'none';
            
            // Resetar formulários
            loginForm.reset();
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        }
        
        // Obter transações do usuário atual
        function getUserTransactions() {
            return users[currentUser].transactions;
        }
        
        // Alternar menu
        function toggleMenu(show) {
            if (show !== undefined) {
                menuVisible = show;
            } else {
                menuVisible = !menuVisible;
            }
            
            sideMenu.style.display = menuVisible ? 'block' : 'none';
        }
        
        // Atualizar menu lateral
        function updateSideMenu() {
            dynamicButtons.innerHTML = '';
            
            if (currentScreen === 'addIncome') {
                dynamicButtons.appendChild(addExpenseButton);
            } else if (currentScreen === 'addExpense') {
                dynamicButtons.appendChild(addIncomeButton);
            } else {
                dynamicButtons.appendChild(addIncomeButton);
                dynamicButtons.appendChild(addExpenseButton);
            }
        }
        
        // Limpar conteúdo principal
        function clearContent() {
            mainContent.innerHTML = '';
        }
        
        // Mostrar tela inicial
        function showHomeScreen() {
            currentScreen = 'home';
            clearContent();
            toggleMenu(false);
            updateSideMenu();
            
            const transactions = getUserTransactions();
            
            // Calcular totais
            const totalIncome = transactions.incomes.reduce((sum, t) => sum + t.value, 0);
            const totalExpense = transactions.expenses.reduce((sum, t) => sum + t.value, 0);
            const balance = totalIncome - totalExpense;
            
            // Criar HTML da tela inicial
            const html = `
                <h1 class="page-title">Bem-vindo, ${users[currentUser].name}</h1>
                
                <div class="main-buttons">
                    <div class="main-button income-btn" id="homeIncomeButton">
                        ${icons.income}<br>Adicionar Receita
                    </div>
                    <div class="main-button expense-btn" id="homeExpenseButton">
                        ${icons.expense}<br>Adicionar Despesa
                    </div>
                    <div class="main-button report-btn" id="homeReportButton">
                        ${icons.report}<br>Relatório
                    </div>
                    <div class="main-button summary-btn" id="homeSummaryButton">
                        ${icons.summary}<br>Resumo
                    </div>
                </div>
                
                <div class="card">
                    <h2 class="card-title">Resumo Financeiro</h2>
                    <div class="form-group">
                        <label>Receitas: R$ ${totalIncome.toFixed(2)}</label>
                    </div>
                    <div class="form-group">
                        <label>Despesas: R$ ${totalExpense.toFixed(2)}</label>
                    </div>
                    <div class="form-group">
                        <label style="font-weight: bold; color: ${balance >= 0 ? '#4CAF50' : '#F44336'}">
                            Saldo: R$ ${balance.toFixed(2)}
                        </label>
                    </div>
                </div>
            `;
            
            mainContent.innerHTML = html;
            
            // Adicionar event listeners
            document.getElementById('homeIncomeButton').addEventListener('click', showAddIncome);
            document.getElementById('homeExpenseButton').addEventListener('click', showAddExpense);
            document.getElementById('homeReportButton').addEventListener('click', showReportScreen);
            document.getElementById('homeSummaryButton').addEventListener('click', showSummaryScreen);
        }
        
        // Mostrar formulário para adicionar transação
        function showAddTransaction(type) {
            currentScreen = type === 'income' ? 'addIncome' : 'addExpense';
            clearContent();
            toggleMenu(true);
            updateSideMenu();
            
            const today = new Date();
            const formattedDate = `${today.getDate().toString().padStart(2, '0')}/${(today.getMonth() + 1).toString().padStart(2, '0')}/${today.getFullYear()}`;
            
            let categoryField = '';
            if (type === 'expense') {
                const categoryOptions = expenseCategories.map(cat => 
                    `<option value="${cat.name}">${cat.icon} ${cat.name}</option>`
                ).join('');
                
                categoryField = `
                    <div class="form-group">
                        <label class="form-label">Categoria:</label>
                        <select class="form-control" id="categoryInput">
                            ${categoryOptions}
                        </select>
                    </div>
                `;
            }
            
            const html = `
                <h1 class="page-title">Adicionar ${type === 'income' ? 'Receita' : 'Despesa'}</h1>
                
                <div class="card">
                    <form id="transactionForm">
                        <div class="form-group">
                            <label class="form-label">Valor (R$):</label>
                            <input type="number" step="0.01" class="form-control" id="valueInput" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Descrição:</label>
                            <input type="text" class="form-control" id="descriptionInput">
                        </div>
                        
                        ${categoryField}
                        
                        <div class="form-group">
                            <label class="form-label">Data:</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" class="form-control" id="dateInput" value="${formattedDate}">
                                <button type="button" class="accent-button" id="calendarButton" style="padding: 8px;">${icons.calendar}</button>
                            </div>
                        </div>
                        
                        <button type="submit" class="accent-button" style="margin-top: 20px;">
                            ${icons.save} Salvar ${type === 'income' ? 'Receita' : 'Despesa'}
                        </button>
                    </form>
                </div>
            `;
            
            mainContent.innerHTML = html;
            
            // Adicionar event listeners
            document.getElementById('transactionForm').addEventListener('submit', (e) => {
                e.preventDefault();
                saveTransaction(type);
            });
            
            document.getElementById('calendarButton').addEventListener('click', showCalendar);
        }
        
        // Mostrar calendário
        function showCalendar() {
            const dateInput = document.getElementById('dateInput');
            const today = new Date();
            
            // Criar elementos do calendário
            const calendarHTML = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                           background-color: rgba(0,0,0,0.5); display: flex; 
                           justify-content: center; align-items: center; z-index: 1000;">
                    <div style="background-color: var(--card-bg-color); padding: 20px; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <button id="prevMonth">◀</button>
                            <h3 id="calendarTitle" style="margin: 0;"></h3>
                            <button id="nextMonth">▶</button>
                        </div>
                        <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;"></div>
                        <div style="display: flex; justify-content: center; margin-top: 15px; gap: 10px;">
                            <button class="accent-button" id="selectDate">Selecionar</button>
                            <button class="accent-button" id="cancelCalendar">Cancelar</button>
                        </div>
                    </div>
                </div>
            `;
            
            const calendarOverlay = document.createElement('div');
            calendarOverlay.innerHTML = calendarHTML;
            document.body.appendChild(calendarOverlay);
            
            let currentMonth = today.getMonth();
            let currentYear = today.getFullYear();
            
            function renderCalendar() {
                const firstDay = new Date(currentYear, currentMonth, 1);
                const lastDay = new Date(currentYear, currentMonth + 1, 0);
                const daysInMonth = lastDay.getDate();
                
                document.getElementById('calendarTitle').textContent = 
                    `${months[currentMonth]} ${currentYear}`;
                
                const daysContainer = document.getElementById('calendarDays');
                daysContainer.innerHTML = '';
                
                // Dias da semana
                const weekdays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                weekdays.forEach(day => {
                    const dayElement = document.createElement('div');
                    dayElement.textContent = day;
                    dayElement.style.textAlign = 'center';
                    dayElement.style.fontWeight = 'bold';
                    daysContainer.appendChild(dayElement);
                });
                
                // Dias vazios no início
                for (let i = 0; i < firstDay.getDay(); i++) {
                    daysContainer.appendChild(document.createElement('div'));
                }
                
                // Dias do mês
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayElement = document.createElement('button');
                    dayElement.textContent = day;
                    dayElement.style.border = 'none';
                    dayElement.style.background = 'transparent';
                    dayElement.style.cursor = 'pointer';
                    
                    if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                        dayElement.style.fontWeight = 'bold';
                        dayElement.style.color = 'var(--highlight-color)';
                    }
                    
                    dayElement.addEventListener('click', () => {
                        const selectedDay = day.toString().padStart(2, '0');
                        const selectedMonth = (currentMonth + 1).toString().padStart(2, '0');
                        dateInput.value = `${selectedDay}/${selectedMonth}/${currentYear}`;
                    });
                    
                    daysContainer.appendChild(dayElement);
                }
            }
            
            renderCalendar();
            
            // Event listeners para navegação
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar();
            });
            
            document.getElementById('nextMonth').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar();
            });
            
            document.getElementById('selectDate').addEventListener('click', () => {
                calendarOverlay.remove();
            });
            
            document.getElementById('cancelCalendar').addEventListener('click', () => {
                calendarOverlay.remove();
            });
        }
        
        // Salvar transação
        function saveTransaction(type) {
            const value = parseFloat(document.getElementById('valueInput').value);
            const description = document.getElementById('descriptionInput').value || 'Sem descrição';
            const date = document.getElementById('dateInput').value;
            
            // Validação
            if (isNaN(value) || value <= 0) {
                alert('Valor deve ser um número positivo!');
                return;
            }
            
            // Validar data
            const dateRegex = /^\d{2}\/\d{2}\/\d{4}$/;
            if (!dateRegex.test(date)) {
                alert('Data inválida! Use o formato DD/MM/AAAA.');
                return;
            }
            
            // Criar transação
            const transaction = {
                description,
                value,
                date
            };
            
            if (type === 'expense') {
                transaction.category = document.getElementById('categoryInput').value;
            }
            
            // Adicionar aos dados do usuário
            const userTransactions = getUserTransactions();
            userTransactions[type === 'income' ? 'incomes' : 'expenses'].push(transaction);
            saveData();
            
            // Limpar formulário
            document.getElementById('valueInput').value = '';
            document.getElementById('descriptionInput').value = '';
            document.getElementById('dateInput').value = new Date().toLocaleDateString('pt-BR');
            
            // Mostrar mensagem de sucesso
            alert(`${type === 'income' ? 'Receita' : 'Despesa'} adicionada com sucesso!`);
            
            // Voltar para a tela inicial
            showHomeScreen();
        }
        
        // Mostrar tela de relatórios
        function showReportScreen() {
            currentScreen = 'report';
            clearContent();
            toggleMenu(true);
            updateSideMenu();
            
            // Criar filtros
            const html = `
                <h1 class="page-title">Relatório de Transações</h1>
                
                <div class="card">
                    <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
                        <div style="flex: 1; min-width: 150px;">
                            <label class="form-label">Tipo:</label>
                            <select class="form-control" id="typeFilter">
                                <option value="all">Todos</option>
                                <option value="income">Receita</option>
                                <option value="expense">Despesa</option>
                            </select>
                        </div>
                        
                        <div style="flex: 1; min-width: 150px;">
                            <label class="form-label">Categoria:</label>
                            <select class="form-control" id="categoryFilter">
                                <option value="all">Todas</option>
                                ${expenseCategories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('')}
                            </select>
                        </div>
                        
                        <div style="flex: 1; min-width: 150px;">
                            <label class="form-label">Período:</label>
                            <div style="display: flex; gap: 10px;">
                                <select class="form-control" id="monthFilter">
                                    <option value="all">Todos</option>
                                    ${months.map((month, index) => `<option value="${index}">${month}</option>`).join('')}
                                </select>
                                <select class="form-control" id="yearFilter">
                                    <option value="all">Todos</option>
                                    ${Array.from({length: 6}, (_, i) => new Date().getFullYear() - 5 + i)
                                      .map(year => `<option value="${year}">${year}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        
                        <div style="display: flex; align-items: flex-end;">
                            <button class="accent-button" id="applyFilters">Aplicar Filtros</button>
                        </div>
                        
                        <div style="display: flex; align-items: flex-end;">
                            <button class="accent-button" id="deleteSelected">${icons.delete} Excluir Selecionado</button>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table class="data-table" id="transactionsTable">
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Valor (R$)</th>
                                    <th>Categoria</th>
                                    <th>Tipo</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            `;
            
            mainContent.innerHTML = html;
            
            // Atualizar tabela inicial
            updateTransactionsTable();
            
            // Adicionar event listeners
            document.getElementById('applyFilters').addEventListener('click', updateTransactionsTable);
            document.getElementById('deleteSelected').addEventListener('click', deleteSelectedTransaction);
        }
        
        // Atualizar tabela de transações
        function updateTransactionsTable() {
            const typeFilter = document.getElementById('typeFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
            const monthFilter = document.getElementById('monthFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;
            
            const tableBody = document.querySelector('#transactionsTable tbody');
            tableBody.innerHTML = '';
            
            const userTransactions = getUserTransactions();
            
            // Filtrar e exibir receitas
            if (typeFilter === 'all' || typeFilter === 'income') {
                userTransactions.incomes.forEach(income => {
                    const date = new Date(income.date.split('/').reverse().join('-'));
                    const incomeMonth = date.getMonth();
                    const incomeYear = date.getFullYear();
                    
                    // Aplicar filtros
                    if (monthFilter !== 'all' && parseInt(monthFilter) !== incomeMonth) return;
                    if (yearFilter !== 'all' && parseInt(yearFilter) !== incomeYear) return;
                    
                    const row = document.createElement('tr');
                    row.style.color = '#2e7d32'; // Verde escuro
                    row.innerHTML = `
                        <td>${income.date}</td>
                        <td>${income.description}</td>
                        <td>R$ ${income.value.toFixed(2)}</td>
                        <td>-</td>
                        <td>Receita</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            
            // Filtrar e exibir despesas
            if (typeFilter === 'all' || typeFilter === 'expense') {
                userTransactions.expenses.forEach(expense => {
                    const date = new Date(expense.date.split('/').reverse().join('-'));
                    const expenseMonth = date.getMonth();
                    const expenseYear = date.getFullYear();
                    
                    // Aplicar filtros
                    if (monthFilter !== 'all' && parseInt(monthFilter) !== expenseMonth) return;
                    if (yearFilter !== 'all' && parseInt(yearFilter) !== expenseYear) return;
                    if (categoryFilter !== 'all' && expense.category !== categoryFilter) return;
                    
                    const categoryIcon = expenseCategories.find(cat => cat.name === expense.category)?.icon || icons.other;
                    
                    const row = document.createElement('tr');
                    row.style.color = '#c62828'; // Vermelho escuro
                    row.innerHTML = `
                        <td>${expense.date}</td>
                        <td>${expense.description}</td>
                        <td>R$ ${expense.value.toFixed(2)}</td>
                        <td>${categoryIcon} ${expense.category}</td>
                        <td>Despesa</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }
        
        // Excluir transação selecionada
        function deleteSelectedTransaction() {
            const selectedRow = document.querySelector('#transactionsTable tbody tr.selected');
            if (!selectedRow) {
                alert('Nenhuma transação selecionada!');
                return;
            }
            
            if (!confirm('Deseja realmente excluir esta transação?')) {
                return;
            }
            
            const cells = selectedRow.cells;
            const date = cells[0].textContent;
            const description = cells[1].textContent;
            const value = parseFloat(cells[2].textContent.replace('R$ ', ''));
            const type = cells[4].textContent;
            
            // Encontrar e remover a transação
            const userTransactions = getUserTransactions();
            const transactionType = type === 'Receita' ? 'incomes' : 'expenses';
            const index = userTransactions[transactionType].findIndex(t => 
                t.date === date && 
                t.description === description && 
                t.value === value
            );
            
            if (index !== -1) {
                userTransactions[transactionType].splice(index, 1);
                saveData();
                updateTransactionsTable();
                alert('Transação excluída com sucesso!');
            }
        }
        
        // Mostrar tela de resumo
        function showSummaryScreen() {
            currentScreen = 'summary';
            clearContent();
            toggleMenu(true);
            updateSideMenu();
            
            const userTransactions = getUserTransactions();
            
            // Calcular totais
            const totalIncome = userTransactions.incomes.reduce((sum, t) => sum + t.value, 0);
            const totalExpense = userTransactions.expenses.reduce((sum, t) => sum + t.value, 0);
            const balance = totalIncome - totalExpense;
            
            // Criar HTML da tela de resumo
            const html = `
                <h1 class="page-title">Resumo Financeiro</h1>
                
                <div class="summary-cards">
                    <div class="summary-card income-card">
                        <div class="summary-card-title">Receitas</div>
                        <div class="summary-card-value">R$ ${totalIncome.toFixed(2)}</div>
                    </div>
                    
                    <div class="summary-card expense-card">
                        <div class="summary-card-title">Despesas</div>
                        <div class="summary-card-value">R$ ${totalExpense.toFixed(2)}</div>
                    </div>
                    
                    <div class="summary-card balance-card">
                        <div class="summary-card-title">Saldo</div>
                        <div class="summary-card-value">R$ ${balance.toFixed(2)}</div>
                    </div>
                </div>
                
                <div class="card">
                    <h2 class="card-title">Distribuição Financeira</h2>
                    <div class="chart-container">
                        <canvas id="financeChart"></canvas>
                    </div>
                </div>
            `;
            
            mainContent.innerHTML = html;
            
            // Criar gráfico
            renderFinanceChart();
        }
        
        // Renderizar gráfico de pizza
        function renderFinanceChart() {
            const userTransactions = getUserTransactions();
            const totalIncome = userTransactions.incomes.reduce((sum, t) => sum + t.value, 0);
            const totalExpense = userTransactions.expenses.reduce((sum, t) => sum + t.value, 0);
            
            if (totalIncome === 0 && totalExpense === 0) {
                document.getElementById('financeChart').parentElement.innerHTML = 
                    '<p>Nenhuma transação registrada</p>';
                return;
            }
            
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Receitas', 'Despesas'],
                    datasets: [{
                        data: [totalIncome, totalExpense],
                        backgroundColor: ['#4CAF50', '#F44336'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: 'Distribuição de Receitas e Despesas'
                        }
                    }
                }
            });
        }
        
        // Mostrar formulário de receita
        function showAddIncome() {
            showAddTransaction('income');
        }
        
        // Mostrar formulário de despesa
        function showAddExpense() {
            showAddTransaction('expense');
        }
        
        // Alternar tema
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            settings.theme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            
            // Salvar preferência do usuário
            if (currentUser) {
                users[currentUser].settings.theme = settings.theme;
                saveData();
            }
        }
        
        // Inicialização
        function init() {
            loadData();
            
            // Event listeners para login/registro
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (authenticateUser(email, password)) {
                    startUserSession(email);
                }
            });
            
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('registerName').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                
                if (registerUser(name, email, password)) {
                    alert('Conta criada com sucesso! Faça login para continuar.');
                    toggleLoginRegister();
                }
            });
            
            registerLink.addEventListener('click', toggleLoginRegister);
            backToLoginLink.addEventListener('click', toggleLoginRegister);
            logoutButton.addEventListener('click', endUserSession);
            
            // Event listeners para a aplicação principal
            backButton.addEventListener('click', showHomeScreen);
            addIncomeButton.addEventListener('click', showAddIncome);
            addExpenseButton.addEventListener('click', showAddExpense);
            reportButton.addEventListener('click', showReportScreen);
            summaryButton.addEventListener('click', showSummaryScreen);
            
            // Selecionar linhas na tabela (para exclusão)
            document.addEventListener('click', (e) => {
                if (e.target.closest('#transactionsTable tbody tr')) {
                    const rows = document.querySelectorAll('#transactionsTable tbody tr');
                    rows.forEach(row => row.classList.remove('selected'));
                    e.target.closest('tr').classList.add('selected');
                }
            });
        }
        
        // Iniciar aplicação
        init();
    </script>
</body>
</html>
